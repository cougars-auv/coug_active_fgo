version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/demo"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "🐳"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "🦈"
    groups:
      github-actions:
        patterns:
          - "*"
